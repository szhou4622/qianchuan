<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>千川账户管理</title>
  <style>
    :root{color-scheme:dark;font-family:"Microsoft YaHei",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08111f;color:#e2e8f0}
    .page{max-width:1480px;margin:auto;padding:24px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:28px;margin-bottom:16px}.head-copy{min-width:0;flex:1}
    h1{margin:0;color:#f8fafc;font-size:22px}.sub{margin-top:7px;color:#8494aa;font-size:12px;line-height:1.75}
    button,input,select{font:inherit}button{border:0;border-radius:9px;min-height:38px;padding:0 14px;background:#263750;color:#e2e8f0;cursor:pointer}
    button.primary{background:#0284c7;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}
    .head-actions{width:min(100%,460px);flex:0 0 460px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.head-actions button{width:100%;min-height:40px;padding:0 12px;white-space:nowrap}.head-actions .primary{box-shadow:0 8px 22px #0284c724}.head-actions .secondary{background:#1d2d44}.head-actions .diagnostic{color:#9fb0c6;background:#152237}.head-action-status{display:none;grid-column:1/-1;min-height:31px;padding:7px 10px;border-radius:8px;background:#0b1627;border:1px solid #26364e;color:#93c5fd;font-size:11px;line-height:1.45}.head-action-status.show{display:block}.head-action-status.ok{color:#86efac;border-color:#166534}.head-action-status.bad{color:#fda4af;border-color:#9f1239}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
    .metric,.card{background:#101b2d;border:1px solid #26364e;border-radius:14px}.metric{padding:14px}
    .metric .label{color:#8295ae;font-size:11px}.metric .value{margin-top:6px;color:#f8fafc;font-weight:700;font-size:17px}.metric .hint{margin-top:5px;color:#71839b;font-size:10px;line-height:1.5}
    .notice{display:none;padding:11px 14px;margin-bottom:14px;border:1px solid #1d4ed866;background:#17255466;color:#bfdbfe;border-radius:10px;font-size:12px}.notice.show{display:block}
    .onboarding{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}.step{padding:10px;border:1px solid #26364e;border-radius:10px;background:#0b1627;color:#8295ae;font-size:11px}.step.done{border-color:#166534;color:#86efac}.step.warn{border-color:#92400e;color:#fbbf24}.step.bad{border-color:#be123c;color:#fda4af}
    .toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar .spacer{flex:1}.toggle-line{display:flex;align-items:center;gap:8px;color:#a8b6c9;font-size:12px}
    input[type=checkbox]{accent-color:#0ea5e9}.accounts{display:grid;gap:14px}.card{height:620px;padding:17px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}.card.off{opacity:.78}
    .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.card-head-side{display:flex;align-items:flex-end;flex-direction:column;gap:9px}.account-refresh{min-height:30px;height:30px;padding:0 11px;font-size:11px;background:#1d2d44}.account-name{font-weight:700;color:#f8fafc;font-size:16px}.account-id{margin-top:5px;color:#8295ae;font-size:11px}
    .badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.badge{padding:4px 8px;border-radius:999px;background:#153552;color:#7dd3fc;font-size:10px}.badge.warn{background:#4b3318;color:#fbbf24}.badge.bad{background:#4a2030;color:#fda4af}.badge.ok{background:#173b2a;color:#86efac}
    .account-grid{min-height:0;display:grid;grid-template-columns:minmax(300px,.72fr) minmax(520px,1.28fr);gap:14px;margin-top:15px}.panel{min-height:0;border:1px solid #26364e;background:#091322;border-radius:11px;padding:13px;display:flex;flex-direction:column;overflow:hidden}.settings-panel{overflow-y:auto}.plans-panel{padding-right:7px}
    .panel-title{font-size:12px;font-weight:700;color:#cbd5e1;margin-bottom:10px}.field{margin-top:10px}.field:first-child{margin-top:0}.field label{display:block;color:#8295ae;font-size:11px;margin-bottom:5px}
    select,input[type=search]{height:36px;border:1px solid #33445e;border-radius:8px;background:#07101d;color:#e2e8f0;padding:0 9px}select{width:100%}input[type=search]{min-width:220px}
    .check{display:flex;gap:8px;align-items:flex-start;color:#cbd5e1;font-size:12px;line-height:1.5;margin-top:8px}.check input{margin-top:2px}
    .group-list{max-height:130px;overflow:auto}.group-empty{color:#71839b;font-size:11px}.sync{margin-top:11px;padding:9px;border-radius:8px;background:#07101d;color:#8494aa;font-size:10px;line-height:1.7}
    .plans{min-height:0;display:grid;align-content:start;gap:8px;overflow-y:auto;overscroll-behavior:contain;padding-right:6px;scrollbar-color:#334b6c #091322;scrollbar-width:thin}.plans::-webkit-scrollbar,.settings-panel::-webkit-scrollbar{width:8px}.plans::-webkit-scrollbar-thumb,.settings-panel::-webkit-scrollbar-thumb{background:#334b6c;border-radius:99px}.plan{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:1px solid #26364e;border-radius:9px;background:#101b2d}
    .plan-group{margin-top:12px}.plan-group:first-child{margin-top:0}.plan-group-title{display:flex;justify-content:space-between;color:#7dd3fc;font-size:11px;font-weight:700;margin-bottom:7px}.plan.ineligible{opacity:.65}.plan input:disabled{cursor:not-allowed}
    .plan-name{color:#e2e8f0;font-size:12px;font-weight:600;word-break:break-all}.plan-meta{margin-top:4px;color:#71839b;font-size:10px;line-height:1.55}.plan-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}.plan-actions button{height:28px;min-height:28px;padding:0 9px;font-size:10px}.plan-state{white-space:nowrap;font-size:10px}.plan-state.wait{color:#fbbf24}.plan-state.late{color:#fda4af}.plan-state.active{color:#86efac}
    .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}.danger{background:#7f1d1d;color:#fecaca}.empty{padding:70px 20px;border:1px dashed #2b3b54;border-radius:14px;text-align:center;color:#71839b}
    @media(max-width:1050px){.head{flex-direction:column;gap:14px}.head-actions{width:100%;flex-basis:auto}}
    @media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}.onboarding{grid-template-columns:1fr}.account-grid{grid-template-columns:1fr}.card{height:auto;min-height:620px;overflow:visible}.panel{min-height:260px}.plans{max-height:480px}}
    @media(max-width:560px){.head-actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="page">
  <div class="head">
    <div class="head-copy">
      <h1>千川账户管理</h1>
      <div class="sub">所有账户共用当前千川登录会话。工具不会自动导入全部授权账户；请一次选择并添加一个当前账户，之后只刷新已添加账户的计划。</div>
    </div>
    <div class="head-actions" aria-label="千川账户操作">
      <button class="primary" id="addAccount">选择并添加账户</button>
      <button class="secondary" id="discover">刷新全部账户计划</button>
      <button class="secondary" id="relogin">打开Chrome重新登录/核验</button>
      <button class="diagnostic" id="diagnostics" title="仅在采集、浏览器或推送异常时使用">故障诊断</button>
      <div class="head-action-status" id="catalogActionStatus" role="status" aria-live="polite"></div>
    </div>
  </div>
  <div class="onboarding" id="onboarding"></div>
  <div class="summary">
    <div class="metric"><div class="label">千川主登录会话</div><div class="value" id="sessionValue">读取中</div><div class="hint" id="sessionHint">—</div></div>
    <div class="metric"><div class="label">监控容量</div><div class="value" id="capacityValue">—</div><div class="hint" id="capacityHint">—</div></div>
    <div class="metric"><div class="label">监控时效</div><div class="value" id="lagValue">—</div><div class="hint">目标5分钟采集；超过10分钟会明确告警</div></div>
    <div class="metric"><div class="label">共享浏览器队列</div><div class="value" id="queueValue">—</div><div class="hint">追投 ＞ 停投 ＞ 采集 ＞ 日志同步</div></div>
  </div>
  <div class="notice" id="notice"></div>
  <div class="toolbar">
    <label class="toggle-line"><input type="checkbox" id="autostart"> Windows开机自动启动工具（默认关闭）</label>
    <span class="spacer"></span>
    <input type="search" id="planSearch" placeholder="搜索计划名称或ID">
    <select id="planStatus" style="width:170px"><option value="current">当前全部计划</option><option value="eligible">可监控</option><option value="unverified">待核验/不可用</option><option value="active">投放中</option><option value="paused">暂停/结束</option><option value="all">包含已消失旧数据</option></select>
    <button id="refresh" title="只重新读取本地数据，不访问千川后台">刷新页面显示</button>
  </div>
  <div class="accounts" id="accounts"></div>
  <div class="empty" id="empty">尚未添加千川账户。请先完成登录，再点击“选择并添加当前账户”，在Chrome中切换账户并打开任意一条计划详情。</div>
</main>
<script>
  const $=id=>document.getElementById(id);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const api=()=>window.top.pywebviewAPI||window.pywebview?.api;
  async function waitApi(){for(let i=0;i<100;i++){const a=api();if(a)return a;await new Promise(r=>setTimeout(r,100));}return null}
  function message(text,bad=false){$('notice').textContent=text||'';$('notice').classList.toggle('show',!!text);$('notice').style.borderColor=bad?'#be123c88':'#1d4ed866'}
  const scene=x=>x==='product'?'推商品':x==='live'?'推直播':'场景待确认';
  const system=x=>x==='global'?'全域':x==='chengfang'?'乘方':'体系待确认';
  const capText=x=>x==='active'?'正常监控':x==='capacity_waiting'?'等待监控容量':'未参与监控';
  const platformStatus=x=>({active:'投放中',enabled:'已启用',delivering:'投放中',learning:'学习中',paused:'已暂停',ended:'已结束',deleted:'已删除',historical:'历史计划',unknown:'状态待确认'}[x]||x||'状态待确认');
  const verificationText=x=>({legacy_unverified:'旧数据待重新核验',candidate:'列表候选，待详情核验',verified:'详情已核验',missing:'目录中已消失',error:'核验失败'}[x]||'待核验');
  const accountStatus=x=>({available:'可访问',pending:'待识别',authorization_missing:'授权已失效'}[x]||x||'待识别');
  const catalogStatus=x=>({complete:'完整',partial:'不完整',not_synced:'未同步',syncing:'同步中',login_required:'需要重新登录',error:'同步失败'}[x]||x||'未同步');
  const logStatus=x=>({ok:'同步正常',partial:'部分完成',empty:'暂无记录',login_required:'需要重新登录',not_configured:'尚未配置',error:'同步失败'}[x]||x||'尚未配置');
  const groupDefs=[['global','live','全域 · 推直播'],['global','product','全域 · 推商品'],['chengfang','live','乘方 · 推直播'],['chengfang','product','乘方 · 推商品'],['unknown','all','待确认/其他']];
  let latest=null,dirty=false,catalogWatchTimer=null,catalogWatchBusy=false,loadInFlight=null;

  function filteredPlans(plans){
    const query=($('planSearch')?.value||'').trim().toLowerCase();
    const status=$('planStatus')?.value||'current';
    return plans.filter(p=>{
      if(query&&!`${p.plan_name||''} ${p.ad_id||''}`.toLowerCase().includes(query))return false;
      if(status!=='all'&&p.verification_state==='missing')return false;
      if(status==='eligible'&&!p.monitor_eligible)return false;
      if(status==='unverified'&&p.monitor_eligible)return false;
      if(status==='active'&&!['active','enabled','delivering','learning'].includes(p.platform_status))return false;
      if(status==='paused'&&!['paused','ended','deleted','historical'].includes(p.platform_status))return false;
      return true;
    });
  }

  function planRows(plans,accountEnabled){
    const rows=filteredPlans(plans);
    if(!rows.length)return '<div class="group-empty">当前筛选条件下没有计划。</div>';
    return groupDefs.map(([sys,sc,label])=>{
      const items=rows.filter(p=>sys==='unknown'?(!['global','chengfang'].includes(p.plan_system)||!['live','product'].includes(p.promotion_scene)):(p.plan_system===sys&&p.promotion_scene===sc));
      if(!items.length)return '';
      return `<div class="plan-group"><div class="plan-group-title"><span>${label}</span><span>${items.length} 条</span></div>${items.map(p=>{
        const state=p.capacity_state||'disabled';
        const selected=!!p.enabled;
        const firstRun=selected&&accountEnabled&&state==='active'&&!p.last_sync_at;
        const late=selected&&accountEnabled&&state==='active'&&!!p.last_sync_at&&Number(p.last_lag_seconds||0)>600;
        const blocked=!!p.automation_write_blocked;const eligible=!!p.monitor_eligible;
        const reason=p.ineligible_reason||(!eligible?'目录尚未核验':'');
        const waitingRestore=!eligible&&selected;
        const stateLabel=waitingRestore?'已选择，待核验恢复':!eligible?'禁止自动化':blocked?'自动写入已封锁':!accountEnabled&&selected?'账户已停用':!selected?'未参与监控':firstRun?'等待首次采集':late?'监控延迟':capText(state);
        const disabled=(!eligible&&!p.enabled)||(!accountEnabled&&!p.enabled);
        return `<label class="plan ${eligible?'':'ineligible'}"><span><span class="plan-name">${esc(p.plan_name||'未命名计划')}</span><span class="plan-meta">${scene(p.promotion_scene)} · ${system(p.plan_system)} · ${platformStatus(p.platform_status)}<br>计划ID ${esc(p.ad_id||'')} · ${verificationText(p.verification_state)}${reason?`<br>不可启用：${esc(reason)}`:''}${p.last_verification_error?`<br>最近核验：${esc(p.last_verification_error)}`:''}${blocked?`<br>自动写入封锁：${esc(p.write_block_reason||'请人工核对')}`:''}</span></span><span class="plan-actions"><button type="button" data-advanced="${esc(p.target_uid)}">高级设置</button><input type="checkbox" data-target="${esc(p.target_uid)}" data-eligible="${eligible?'1':'0'}" ${p.enabled?'checked':''} ${disabled?'disabled':''}><span class="plan-state ${blocked||late||!eligible?'late':firstRun||state==='capacity_waiting'?'wait':selected&&state==='active'?'active':''}" data-enabled-label="${esc(stateLabel)}">${!accountEnabled&&eligible&&!p.enabled?'先启用账户':stateLabel}</span>${blocked?`<button type="button" data-unblock="${esc(p.target_uid)}">核对后解除</button>`:''}</span></label>`;
      }).join('')}</div>`;
    }).join('');
  }

  function render(data){
    latest=data;
    dirty=false;
    const session=data.session||{};
    $('sessionValue').textContent=session.available?(session.status==='login_required'?'需要重新登录':'已登录'):'未登录';
    $('sessionHint').textContent=(session.encrypted?'Cookie已用Windows DPAPI加密':'尚未完成加密迁移')+(session.updated_at?' · '+session.updated_at:'')+(session.last_error?' · '+session.last_error:'');
    const capacity=data.capacity||{};
    $('capacityValue').textContent=`${capacity.active_count||0} 正常 / ${capacity.waiting_count||0} 容量等待 / ${capacity.disabled_count||0} 未启用或不可用`;
    $('capacityHint').textContent=`容量只统计已核验且已勾选计划；预计一轮 ${capacity.estimated_cycle_seconds||0} 秒，预算 ${capacity.capacity_window_seconds||540} 秒`;
    $('lagValue').textContent=capacity.delayed_count?`${capacity.delayed_count} 条延迟`:(capacity.active_count||capacity.waiting_count?'时效正常':'暂无可监控计划');
    const queue=data.browser_queue||{};
    $('queueValue').textContent=queue.active?`执行中 · 等待${queue.waiting_count||0}`:`空闲 · 等待${queue.waiting_count||0}`;
    $('autostart').checked=!!data.autostart?.enabled;
    const progress=data.onboarding||{};
    const catalog=data.catalog||{};
    const loginFailed=session.status==='login_required'||catalog.failure_kind==='login_required';
    const steps=[
      {done:progress.qianchuan_login,bad:loginFailed,label:'1. 千川登录',hint:loginFailed?'需要在可见Chrome重新登录':''},
      {done:progress.catalog_complete,bad:loginFailed||catalog.status==='error',warn:progress.catalog_attempted&&!progress.catalog_complete,label:'2. 账户与计划目录',hint:progress.catalog_complete?'目录完整':progress.catalog_attempted?'同步未完成':'尚未同步'},
      {done:progress.feishu_bound,label:'3. 飞书长连接与绑定'},
      {done:progress.plans_selected,warn:!progress.plans_selected&&progress.catalog_attempted,label:'4. 路由与监控计划',hint:!progress.plans_selected&&progress.catalog_attempted?'暂无可执行计划':''},
      {done:progress.rules_configured,warn:progress.rules_saved_without_eligible_plan,label:'5. 追投/停投策略',hint:progress.rules_saved_without_eligible_plan?'规则已保存，但无可执行计划':''}
    ];
    $('onboarding').innerHTML=steps.map(step=>`<div class="step ${step.done?'done':step.bad?'bad':step.warn?'warn':''}">${step.done?'✓':'○'} ${step.label}${step.hint?`<br>${esc(step.hint)}`:''}</div>`).join('');
    const groups=data.feishu?.groups||[];
    const targets=data.targets||[];
    const accounts=data.accounts||[];
    const daily=data.daily_report?.config||{};
    if(loginFailed){
      message((catalog.error||session.last_error||'千川登录状态已失效')+'；请点击“打开Chrome重新登录/核验”。',true);
    }else if(catalog.status==='error'){
      message(catalog.error||catalog.message||'账户计划目录同步失败',true);
    }else if(accounts.some(acc=>!!acc.report_enabled)&&!daily.enabled){
      message('账户已勾选纳入日报，但全局自动日报尚未开启。请到“飞书绑定”页面开启自动日报。',true);
    }else{
      message('');
    }
    $('empty').style.display=accounts.length?'none':'block';
    $('accounts').innerHTML=accounts.map(acc=>{
      const plans=targets.filter(t=>String(t.account_uid||'')===String(acc.account_uid||''));
      const log=acc.log_sync||{};
      const routeGroups=new Set(acc.route_group_ids||[]);
      const statusClass=acc.last_status==='available'&&!acc.catalog_error?'ok':acc.last_error||acc.catalog_error?'bad':'warn';
      return `<section class="card ${acc.enabled?'':'off'}" data-account="${esc(acc.account_uid)}">
        <div class="card-head"><div><div class="account-name">${esc(acc.account_name||'未命名账户')}</div><div class="account-id">账户ID ${esc(acc.aavid)}</div></div>
          <div class="card-head-side"><div class="badges"><span class="badge ${statusClass}">${accountStatus(acc.last_status)}</span><span class="badge ${acc.catalog_status==='complete'?'ok':'warn'}">目录${catalogStatus(acc.catalog_status)}</span><span class="badge">${acc.plan_count||0} 条 / ${acc.eligible_plan_count||0} 条可监控</span>${acc.waiting_plan_count?`<span class="badge warn">${acc.waiting_plan_count} 条等待容量</span>`:''}</div><button type="button" class="account-refresh" data-refresh-account="${esc(acc.account_uid)}">刷新此账户计划</button></div>
        </div>
        <div class="account-grid">
          <div class="panel settings-panel">
            <div class="panel-title">账户与日报</div>
            <label class="check"><input type="checkbox" data-field="enabled" ${acc.enabled?'checked':''}>启用此千川账户；关闭后该账户全部自动化暂停</label>
            <label class="check"><input type="checkbox" data-field="report_enabled" ${acc.report_enabled?'checked':''}>同步昨日操作日志并纳入09:00日报</label>
            <div class="field"><label>飞书接收位置</label><select data-field="route_mode"><option value="default" ${acc.route_mode==='default'?'selected':''}>使用管理员默认位置</option><option value="custom" ${acc.route_mode==='custom'?'selected':''}>为此账户单独配置</option></select></div>
            <div data-custom-route style="${acc.route_mode==='custom'?'':'display:none'}">
              <label class="check"><input type="checkbox" data-field="route_send_personal" ${acc.route_send_personal?'checked':''}>发送给已绑定的唯一确认人</label>
              <div class="field"><label>发送到已绑定群</label><div class="group-list">${groups.length?groups.map(g=>`<label class="check"><input type="checkbox" data-group="${esc(g.chat_id)}" ${routeGroups.has(String(g.chat_id))?'checked':''}>${esc(g.name||g.chat_name||g.chat_id)}</label>`).join(''):'<div class="group-empty">还没有绑定群，请先到“飞书绑定”页面绑定。</div>'}</div></div>
            </div>
            <div class="sync">计划目录：${catalogStatus(acc.catalog_status)} · ${esc(acc.catalog_last_sync_at||'—')}${acc.catalog_error?'<br>目录说明：'+esc(acc.catalog_error):''}<br>后台日志：${logStatus(log.last_status)}<br>最后同步：${esc(log.last_sync_at||'—')}<br>覆盖：${esc(log.coverage_from||'—')} 至 ${esc(log.coverage_to||'—')}${log.last_error?'<br>异常：'+esc(log.last_error):''}</div>
          </div>
          <div class="panel plans-panel">
            <div class="panel-title">该账户全部计划（全域/乘方 × 推直播/推商品）</div>
            <div class="plans">${plans.length?planRows(plans,!!acc.enabled):'<div class="group-empty">此账户还没有同步到计划。点击本账户右上角“刷新此账户计划”。</div>'}</div>
          </div>
        </div>
        <div class="actions"><button class="danger" data-remove>删除此账户</button><button data-save>保存此账户设置</button></div>
      </section>`;
    }).join('');
    document.querySelectorAll('[data-field=route_mode]').forEach(el=>el.onchange=()=>{el.closest('.panel').querySelector('[data-custom-route]').style.display=el.value==='custom'?'':'none'});
    document.querySelectorAll('[data-save]').forEach(btn=>btn.onclick=()=>saveAccount(btn.closest('.card')));
    document.querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=()=>removeAccount(btn.closest('.card')));
    document.querySelectorAll('[data-refresh-account]').forEach(btn=>btn.onclick=()=>discover(btn.dataset.refreshAccount||'',btn));
    document.querySelectorAll('[data-advanced]').forEach(btn=>btn.onclick=event=>{
      event.preventDefault();event.stopPropagation();
      window.location.href=`promotion_targets.html?target_uid=${encodeURIComponent(btn.dataset.advanced||'')}`;
    });
    document.querySelectorAll('[data-target]').forEach(input=>input.onchange=event=>{
      const accountEnabled=!!input.closest('.card').querySelector('[data-field=enabled]')?.checked;
      if(!accountEnabled&&input.checked){
        input.checked=false;
        input.disabled=true;
        event.stopPropagation();
        message('请先启用此千川账户，再选择该账户下参与监控的计划。',true);
        return;
      }
      if(input.dataset.eligible!=='1'&&input.checked){
        input.checked=false;
        event.stopPropagation();
        message('该计划尚未通过精确核验，不能重新启用；可以取消旧选择。',true);
      }
      if(!input.checked&&(!accountEnabled||input.dataset.eligible!=='1'))input.disabled=true;
    });
    document.querySelectorAll('[data-field=enabled]').forEach(input=>input.onchange=event=>{
      const card=input.closest('.card');
      card.classList.toggle('off',!input.checked);
      card.querySelectorAll('[data-target]').forEach(planInput=>{
        const canChoose=input.checked&&planInput.dataset.eligible==='1';
        planInput.disabled=!canChoose&&!planInput.checked;
        const state=planInput.closest('.plan')?.querySelector('[data-enabled-label]');
        if(state&&planInput.dataset.eligible==='1'&&!planInput.checked){
          state.textContent=input.checked?state.dataset.enabledLabel:'先启用账户';
        }
      });
    });
    document.querySelectorAll('[data-unblock]').forEach(btn=>btn.onclick=async event=>{
      event.preventDefault();event.stopPropagation();
      if(!window.confirm('仅在已经核对千川追投任务和本地限频流水后解除。确定继续吗？'))return;
      const a=await waitApi();const r=await a.clearPromotionTargetWriteBlock(btn.dataset.unblock);
      if(!r?.success){message(r?.message||'解除失败',true);return}await load();message(r?.message||'自动写入安全封锁已解除');
    });
    $('accounts').onchange=()=>{dirty=true};
  }

  async function load(){
    if(loadInFlight)return await loadInFlight;
    loadInFlight=(async()=>{
      const a=await waitApi();if(!a){message('工具接口尚未就绪',true);return null}
      const r=await a.getQianchuanAccountOverview();if(!r?.success){message(r?.message||'读取账户失败',true);return null}render(r);return r;
    })();
    try{return await loadInFlight}finally{loadInFlight=null}
  }

  function stopCatalogWatch(){
    if(catalogWatchTimer){clearTimeout(catalogWatchTimer);catalogWatchTimer=null}
    catalogWatchBusy=false;
  }

  async function watchCatalogSync({accountUid='',startedAt='',announce=true,button=null}={}){
    if(catalogWatchBusy)return;
    catalogWatchBusy=true;
    const a=await waitApi();
    if(!a){stopCatalogWatch();message('工具接口尚未就绪',true);return}
    button=button||(accountUid?document.querySelector(`[data-refresh-account="${CSS.escape(String(accountUid))}"]`):$('discover'))||$('discover');
    const idleText=accountUid?'刷新此账户计划':'刷新全部账户计划';
    const statusBox=$('catalogActionStatus');
    const showStatus=(text,type='')=>{statusBox.textContent=text||'';statusBox.className=`head-action-status ${text?'show':''} ${type}`.trim()};
    const tick=async()=>{
      let s,overview;
      try{
        s=await a.getQianchuanCatalogSyncStatus();
      }catch(e){
        s={success:false,running:false,status:'error',message:String(e?.message||e)};
      }
      const processed=Number(s?.processed_accounts||0),total=Number(s?.total_accounts||0);
      const progress=total?`${processed}/${total}${s.current_account?' · '+s.current_account:''}`:'准备中';
      if(s?.running){
        button.disabled=true;
        button.textContent=total?`正在刷新 ${processed}/${total}`:'正在读取千川…';
        showStatus(`${s?.message||'正在监听千川后台只读接口'}（${progress}）`);
        catalogWatchTimer=setTimeout(tick,1200);
        return;
      }
      try{overview=await a.getQianchuanAccountOverview()}catch(_){overview=null}
      stopCatalogWatch();button.disabled=false;button.textContent=idleText;
      if(overview?.success)render(overview);else await load();
      const failed=!s?.success||['error','login_required'].includes(String(s?.status||''));
      const finalText=s?.message||(failed?'账户计划刷新失败':'账户计划刷新完成');
      showStatus(finalText,failed?'bad':'ok');
      if(announce)message(finalText,failed);
    };
    await tick();
  }

  async function resumeCatalogWatch(){
    if(catalogWatchBusy)return;
    const a=await waitApi();if(!a)return;
    let s;
    try{s=await a.getQianchuanCatalogSyncStatus()}catch(_){return}
    if(s?.running){
      const uid=String(s.requested_account_uid||'');
      const button=uid?document.querySelector(`[data-refresh-account="${CSS.escape(uid)}"]`):$('discover');
      await watchCatalogSync({accountUid:uid,startedAt:String(s.started_at||''),announce:true,button});
    }else if(s?.finished_at){
      const failed=!s?.success||['error','login_required'].includes(String(s?.status||''));
      const box=$('catalogActionStatus');
      box.textContent=s?.message||(failed?'账户计划刷新失败':'账户计划刷新完成');
      box.className=`head-action-status show ${failed?'bad':'ok'}`;
    }
  }
  async function saveAccount(card){
    const a=await waitApi();const uid=card.dataset.account;
    const settings={
      enabled:card.querySelector('[data-field=enabled]').checked,
      report_enabled:card.querySelector('[data-field=report_enabled]').checked,
      route_mode:card.querySelector('[data-field=route_mode]').value,
      route_send_personal:card.querySelector('[data-field=route_send_personal]').checked,
      route_group_ids:Array.from(card.querySelectorAll('[data-group]:checked')).map(x=>x.dataset.group)
    };
    const planStates=Array.from(card.querySelectorAll('[data-target]')).map(x=>({target_uid:x.dataset.target,enabled:x.checked}));
    const r=await a.saveQianchuanAccountAutomationSetup(uid,settings,planStates);
    if(!r?.success){message((r?.message||'账户与计划设置保存失败')+'；本次修改已整体回滚',true);return}
    dirty=false;await load();message('账户、日报路由和监控计划已保存');
  }
  async function removeAccount(card){
    const name=card.querySelector('.account-name')?.textContent||'该账户';
    if(!window.confirm(`确定从工具中删除“${name}”吗？\n\n删除后该账户不再显示，监控、追投、停投和日报会立即关闭；历史操作流水仍会保留。`))return;
    const a=await waitApi();const r=await a.removeQianchuanAccount(card.dataset.account);
    if(!r?.success){message(r?.message||'删除账户失败',true);return}
    dirty=false;await load();message(r?.message||'账户已删除');
  }
  async function discover(accountUid='',triggerButton=null){
    if(dirty){message('当前有尚未保存的账户或计划选择，请先保存后再刷新千川计划。',true);return}
    if(catalogWatchBusy){message('已有账户计划刷新任务正在执行，请等待当前任务结束。',true);return}
    const a=await waitApi();const statusBox=$('catalogActionStatus');const button=triggerButton||$('discover');
    const idleText=accountUid?'刷新此账户计划':'刷新全部账户计划';
    const showStatus=(text,type='')=>{statusBox.textContent=text||'';statusBox.className=`head-action-status ${text?'show':''} ${type}`.trim()};
    let r;
    button.disabled=true;button.textContent='正在提交刷新…';showStatus('正在创建只读刷新任务，不会提交任何千川操作。');
    try{r=await a.startQianchuanCatalogSync(accountUid||null)}catch(e){r={success:false,message:String(e?.message||e)}}
    if(!r?.success){button.disabled=false;button.textContent=idleText;showStatus(r?.message||'刷新任务启动失败','bad');message(r?.message||'刷新任务启动失败',true);return}
    showStatus('刷新任务已进入共享浏览器队列；已排队，等待采集结束');
    stopCatalogWatch();
    await watchCatalogSync({
      accountUid:String(accountUid||''),
      startedAt:String(r.started_at||''),
      announce:true,
      button
    });
  }

  async function reloadDisplay(){
    if(dirty){message('当前有尚未保存的账户或计划选择，请先保存，避免重新读取时丢失修改。',true);return}
    const button=$('refresh');button.disabled=true;button.textContent='正在刷新显示…';
    try{await load();message('页面显示已更新；本次没有访问千川后台。')}
    finally{button.disabled=false;button.textContent='刷新页面显示'}
  }
  async function addAccount(){
    $('addAccount').disabled=true;
    const a=await waitApi();let r;
    try{r=await a.startQianchuanAccountSelection()}catch(e){r={success:false,message:String(e?.message||e)}}
    message(r?.message||'Chrome正在启动。请切换到要添加的千川账户；如果当前账户已经添加，打开该账户任意计划详情即可确认。识别后窗口会自动关闭。',!r?.success);
    if(!r?.success){$('addAccount').disabled=false;return}
    const timer=setInterval(async()=>{
      const s=await a.getPromotionTargetDiscoveryStatus();
      message(s?.message||'请在Chrome中切换到要添加的账户；如果当前账户已经添加，打开任意计划详情即可确认并自动关闭窗口。',!s?.success);
      if(!s?.running){
        clearInterval(timer);$('addAccount').disabled=false;
        await load();
        if(s?.success&&s?.account){
          message('当前千川账户已添加，正在只读刷新这个账户的计划。识别出的计划默认不监控，请刷新完成后自行勾选并保存。');
          await new Promise(resolve=>setTimeout(resolve,1200));
          await discover(String(s.account.account_uid||s.account.aavid||''));
        }else{
          message(s?.message||'未完成账户添加，请重试。',true);
        }
      }
    },1000);
  }
  async function relogin(){
    $('relogin').disabled=true;
    let a,r;
    try{
      a=await waitApi();r=await a.startQianchuanRelogin();
    }catch(e){
      $('relogin').disabled=false;
      message('启动Google Chrome失败：'+String(e?.message||e||'桌面接口不可用'),true);
      return;
    }
    message(r?.message||'Google Chrome正在启动，请稍候。',!r?.success);
    if(!r?.success){$('relogin').disabled=false;return}
    const timer=setInterval(async()=>{
      let s;
      try{
        s=await a.getPromotionTargetDiscoveryStatus();
      }catch(e){
        clearInterval(timer);$('relogin').disabled=false;
        message('读取登录状态失败：'+String(e?.message||e||'桌面接口不可用'),true);
        return;
      }
      message(s?.message||'等待千川登录并确认授权账户',!s?.success);
      if(!s?.running){
        clearInterval(timer);$('relogin').disabled=false;
        if(s?.success&&s?.relogin_complete){
          await load();
          message('千川登录成功并已加密保存。工具没有自动添加任何授权账户；请点击“选择并添加当前账户”。');
        }else{
          await load();
          message(s?.message||'千川重新登录未完成，请重试。',true);
        }
      }
    },1000);
  }
  $('diagnostics').onclick=()=>{window.location.href='control.html'};
  $('relogin').onclick=relogin;$('addAccount').onclick=addAccount;$('discover').onclick=()=>discover('',$('discover'));$('refresh').onclick=reloadDisplay;
  function rerenderCatalogFilter(){
    if(dirty){
      message('当前有尚未保存的账户或计划选择，请先保存后再筛选，避免丢失修改。',true);
      return;
    }
    if(latest)render(latest);
  }
  $('planSearch').oninput=rerenderCatalogFilter;
  $('planStatus').onchange=rerenderCatalogFilter;
  $('autostart').onchange=async()=>{const a=await waitApi();const r=await a.setWindowsAutostart($('autostart').checked);message(r?.message||($('autostart').checked?'开机自启已开启':'开机自启已关闭'),!r?.success);if(!r?.success)$('autostart').checked=!$('autostart').checked};
  window.addEventListener('focus',async()=>{if(!dirty)await load();await resumeCatalogWatch()});
  document.addEventListener('visibilitychange',async()=>{if(!document.hidden){if(!dirty)await load();await resumeCatalogWatch()}});
  load().then(resumeCatalogWatch);setInterval(()=>{if(!dirty&&!catalogWatchBusy&&!document.hidden)load()},60000);
</script>
