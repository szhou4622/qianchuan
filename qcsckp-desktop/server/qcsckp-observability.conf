map $http_user_agent $qcsckp_support_log {
    default 0;
    ~^QCSCKP-Desktop/ 1;
}
log_format qcsckp_support escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"request_id":"$http_x_client_request_id","channel":"$http_x_release_channel","request_seconds":$request_time,"upstream_seconds":"$upstream_response_time"}';
access_log /var/log/nginx/qcsckp-support.log qcsckp_support if=$qcsckp_support_log;
limit_req_zone $binary_remote_addr zone=qcsckp_diagnostics:1m rate=30r/m;
