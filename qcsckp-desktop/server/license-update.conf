server {
    server_name license.dadaozixun.com;

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/license.dadaozixun.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/license.dadaozixun.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name update.dadaozixun.com;

    location = /api/qcsckp/diagnostics {
        client_max_body_size 64k;
        client_body_timeout 5s;
        limit_req zone=qcsckp_diagnostics burst=10 nodelay;
        proxy_pass http://127.0.0.1:8797;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8792;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/license.dadaozixun.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/license.dadaozixun.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = license.dadaozixun.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name license.dadaozixun.com;
    return 404; # managed by Certbot


}

server {
    if ($host = update.dadaozixun.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name update.dadaozixun.com;
    return 404; # managed by Certbot


}
