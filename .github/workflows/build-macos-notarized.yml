name: Build notarized macOS packages

on:
  push:
    tags:
      - "notarize-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing application version to package
        required: true
        default: "0.1.56"

permissions:
  contents: read

jobs:
  macos:
    env:
      PACKAGE_VERSION: ${{ inputs.version || '0.1.56' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: qcsckp-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade uv
          uv sync --frozen --no-install-project

      - name: Materialize signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
        run: |
          test -n "$APPLE_CERTIFICATE_P12_BASE64"
          python -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("qcsckp-developer-id.p12").write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE_P12_BASE64"], validate=True))'
          chmod 600 "$RUNNER_TEMP/qcsckp-developer-id.p12"

      - name: Build, sign and notarize
        env:
          QCSCKP_MAC_ARCH: ${{ matrix.arch }}
          APPLE_CERTIFICATE_PATH: ${{ runner.temp }}/qcsckp-developer-id.p12
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash packaging/macos/build_macos.sh "$PACKAGE_VERSION"

      - name: Verify no secret-bearing runtime files are staged
        run: |
          test ! -e "output/macos/v$PACKAGE_VERSION/dist/QCSCKP.app/Contents/Resources/license_credentials.dpapi"
          test ! -e "output/macos/v$PACKAGE_VERSION/dist/QCSCKP.app/Contents/Resources/license_metadata.json"

      - uses: actions/upload-artifact@v4
        with:
          name: QCSCKP-v${{ env.PACKAGE_VERSION }}-macOS-${{ matrix.arch }}
          path: |
            qcsckp-desktop/output/macos/v${{ env.PACKAGE_VERSION }}/QCSCKP-v${{ env.PACKAGE_VERSION }}-macOS-${{ matrix.arch }}.dmg
            qcsckp-desktop/output/macos/v${{ env.PACKAGE_VERSION }}/QCSCKP-v${{ env.PACKAGE_VERSION }}-macOS-${{ matrix.arch }}.dmg.sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/qcsckp-developer-id.p12"
