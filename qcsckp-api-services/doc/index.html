<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="./">
  <title>API 开发文档 · qcscjk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    #doc-body { line-height: 1.7; }
    #doc-body h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem; color: #0f172a; }
    #doc-body h2 { font-size: 1.25rem; font-weight: 600; margin-top: 1.75rem; margin-bottom: 0.75rem; color: #1e293b; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.35rem; }
    #doc-body h3 { font-size: 1.05rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.5rem; color: #334155; }
    #doc-body p, #doc-body li { color: #475569; }
    #doc-body a { color: #b45309; text-decoration: underline; }
    #doc-body code { background: #f1f5f9; padding: 0.1em 0.35em; border-radius: 0.25rem; font-size: 0.9em; }
    #doc-body pre { background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.75rem 0; }
    #doc-body pre code { background: transparent; color: inherit; padding: 0; }
    #doc-body table { width: 100%; border-collapse: collapse; font-size: 0.875rem; margin: 0.75rem 0; }
    #doc-body th, #doc-body td { border: 1px solid #e2e8f0; padding: 0.5rem 0.75rem; text-align: left; }
    #doc-body th { background: #f8fafc; font-weight: 600; color: #334155; }
    #doc-body hr { margin: 1.25rem 0; border-color: #e2e8f0; }
    #doc-body ul { list-style: disc; padding-left: 1.5rem; margin: 0.5rem 0; }
    .doc-nav-active { background: #1e293b; color: #fbbf24; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen md:h-screen md:overflow-hidden flex flex-col">
  <div class="flex flex-1 flex-col md:flex-row min-h-0 overflow-hidden w-full">
    <aside class="w-full md:w-64 shrink-0 bg-slate-900 text-white md:h-full md:max-h-[100vh] md:overflow-y-auto flex flex-col">
      <div class="p-5 border-b border-slate-700 shrink-0">
        <h1 class="font-bold text-lg tracking-tight">开发文档</h1>
        <p class="text-slate-400 text-xs mt-1">qcscjk 桌面端 API</p>
      </div>
      <nav class="p-3 space-y-1 shrink-0" id="doc-nav">
        <button type="button" data-md="账号查询api文档.md" class="doc-link w-full text-left px-3 py-2.5 rounded-lg text-sm text-slate-200 hover:bg-slate-800 transition">
          账号信息查询 API
        </button>
        <button type="button" data-md="版本更新api文档.md" class="doc-link w-full text-left px-3 py-2.5 rounded-lg text-sm text-slate-200 hover:bg-slate-800 transition">
          版本检测 / 更新 API
        </button>
      </nav>
      <div class="p-4 text-xs text-slate-500 border-t border-slate-800 mt-auto shrink-0">
        <a href="/" class="text-amber-400/90 hover:text-amber-300 hover:underline">← 返回站点首页</a>
        <p class="mt-3 text-slate-600">也可在 IDE 中直接打开本目录下的 <code class="text-slate-400">*.md</code> 源文件。</p>
      </div>
    </aside>
    <main id="doc-main" class="flex-1 min-h-0 overflow-y-auto p-4 md:p-8 lg:p-10">
      <article id="doc-body" class="max-w-4xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200/80 p-6 md:p-10 min-h-[60vh]">
        <p class="text-slate-500 text-sm">正在加载文档…</p>
      </article>
    </main>
  </div>
  <script>
(function () {
  var ALLOWED = ['账号查询api文档.md', '版本更新api文档.md'];
  var navButtons = document.querySelectorAll('.doc-link');

  function setActive(name) {
    navButtons.forEach(function (btn) {
      if (btn.getAttribute('data-md') === name) {
        btn.classList.add('doc-nav-active');
      } else {
        btn.classList.remove('doc-nav-active');
      }
    });
  }

  function loadDoc(name) {
    if (ALLOWED.indexOf(name) === -1) name = ALLOWED[0];
    setActive(name);
    var el = document.getElementById('doc-body');
    el.innerHTML = '<p class="text-slate-500 text-sm">正在加载…</p>';
    fetch(name, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (text) {
        el.innerHTML = typeof marked !== 'undefined' ? marked.parse(text) : '<pre class="text-sm">' + escapeHtml(text) + '</pre>';
        var mainEl = document.getElementById('doc-main');
        if (mainEl) mainEl.scrollTop = 0;
        else window.scrollTo(0, 0);
      })
      .catch(function () {
        el.innerHTML = '<p class="text-red-600 text-sm">加载失败。请确认通过 Web 服务器访问本页（勿用 file:// 直接打开），或直接在仓库中打开对应的 .md 文件。</p>';
      });
    try {
      var u = new URL(location.href);
      u.searchParams.set('doc', name);
      history.replaceState(null, '', u.pathname + '?' + u.searchParams.toString());
    } catch (e) {}
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  navButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      loadDoc(btn.getAttribute('data-md'));
    });
  });

  var start = ALLOWED[0];
  try {
    var q = new URLSearchParams(location.search).get('doc');
    if (q && ALLOWED.indexOf(q) !== -1) start = q;
  } catch (e) {}
  loadDoc(start);
})();
  </script>
</body>
</html>
